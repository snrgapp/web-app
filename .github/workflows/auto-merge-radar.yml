name: Auto-merge Radar

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  merge:
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'cursor/radar-de-convocatorias')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Listo para review y squash a main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          n="${{ github.event.pull_request.number }}"
          gh pr ready "$n" --repo "$repo" || true
          for attempt in 1 2 3 4 5 6 7 8; do
            if gh pr merge "$n" --repo "$repo" --squash --delete-branch; then
              echo "Mergeado el PR #$n"
              exit 0
            fi
            echo "Intento $attempt: esperando checks (Vercel)…"
            sleep 20
          done
          echo "No se pudo mergear el PR #$n. Revisa permisos de Actions o protección de main."
          exit 1
