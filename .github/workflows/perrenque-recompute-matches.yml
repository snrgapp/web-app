# Recomputa grupos/match Perrenque sin Cron de Vercel (no requiere plan Pro).
# Configura en GitHub → Settings → Secrets and variables → Actions:
#   PERRENQUE_RECOMPUTE_URL  = https://tu-dominio.com/api/perrenque/recompute-matches
#   PERRENQUE_RECOMPUTE_SECRET = el mismo valor que CRON_SECRET (o PERRENQUE_RECOMPUTE_SECRET) en Vercel
#
# Intervalo mínimo práctico en GitHub: 5 minutos. Para otra frecuencia usa un servicio HTTP externo
# (p. ej. cron-job.org) que haga POST con Authorization: Bearer <secret>.
# POST sin parámetros = incremental (solo quienes aún no tienen r1+r2). Full rebuild: ?full=1 o {"full":true}.

name: Perrenque recompute matches

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  recompute:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/perrenque/recompute-matches
        env:
          URL: ${{ secrets.PERRENQUE_RECOMPUTE_URL }}
          SECRET: ${{ secrets.PERRENQUE_RECOMPUTE_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then
            echo "::notice::Omitido: añade PERRENQUE_RECOMPUTE_URL y PERRENQUE_RECOMPUTE_SECRET en Actions secrets."
            exit 0
          fi
          curl -sS -f -X POST "$URL" \
            -H "Authorization: Bearer $SECRET" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo ""
