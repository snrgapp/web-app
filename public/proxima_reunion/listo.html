  </head><body class="bg-surface font-body-md text-on-surface min-h-screen flex flex-col antialiased selection:bg-secondary-fixed pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-surface px-margin"><div class="flex flex-col w-full pb-10">
<div class="w-full pt-2 pb-4">
<div class="flex items-center justify-between mb-2">
<div class="flex items-center gap-2">
<span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-secondary text-on-secondary">
<span class="material-symbols-outlined text-xs" style="font-variation-settings: 'FILL' 1;">check</span>
</span>
<span class="font-label-md text-label-md text-on-surface">Paso 4 de 4 • Finalizado</span>
</div>
<span class="font-label-md text-label-md text-secondary font-semibold">100%</span>
</div>
<div class="w-full h-1.5 bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-secondary rounded-full w-full transition-all duration-700"></div>
</div>
</div>
<div class="relative flex flex-col items-center text-center mt-3 mb-6 px-2">


<h1 class="font-headline-xl-mobile text-headline-xl-mobile text-on-surface font-bold tracking-tight">
      ¡Respuestas guardadas, Founder!
    </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-sm mt-2">
      Estamos analizando tu perfil, tracción y retos para ubicarte en la mesa de networking perfecta en tu ciudad.&nbsp;<div><br></div><div class="">Pronto nos pondremos en contacto contigo.</div></p>
</div>
<div class="w-full flex flex-col gap-4">




</div>
<div class="w-full flex flex-col gap-3 mt-7">

<button class="w-full h-12 bg-surface-container-lowest text-on-surface rounded-lg font-label-md text-label-md font-semibold flex items-center justify-center gap-2 active:scale-95 transition-transform shadow-sm" id="btn-share" type="button">
<span class="material-symbols-outlined text-sm text-secondary">share</span>
<span class="">Compartir con otro Emprendedor</span>
</button>
</div>
<div class="fixed bottom-6 left-1/2 -translate-x-1/2 max-w-xs w-full bg-primary text-on-primary px-4 py-3 rounded-lg shadow-xl flex items-center justify-between gap-3 transition-all duration-300 opacity-0 pointer-events-none" id="toast-share">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-tertiary-fixed text-base">check_circle</span>
<span class="font-label-sm text-label-sm">Enlace copiado al portapapeles</span>
</div>
<span class="font-label-sm text-label-sm text-surface-dim font-bold">SNRG</span>
</div>
</div>
<script>
  (function() {
    let secs = 48;
    let mins = 32;
    let hours = 14;
    let days = 2;

    const sEl = document.getElementById('timer-secs');
    const mEl = document.getElementById('timer-mins');
    const hEl = document.getElementById('timer-hours');
    const dEl = document.getElementById('timer-days');

    setInterval(function() {
      if (secs > 0) {
        secs--;
      } else {
        secs = 59;
        if (mins > 0) {
          mins--;
        } else {
          mins = 59;
          if (hours > 0) {
            hours--;
          } else {
            hours = 23;
            if (days > 0) days--;
          }
        }
      }
      if (sEl) sEl.textContent = secs < 10 ? '0' + secs : secs;
      if (mEl) mEl.textContent = mins < 10 ? '0' + mins : mins;
      if (hEl) hEl.textContent = hours < 10 ? '0' + hours : hours;
      if (dEl) dEl.textContent = days < 10 ? '0' + days : days;
    }, 1000);

    const shareBtn = document.getElementById('btn-share');
    const toast = document.getElementById('toast-share');
    if (shareBtn && toast) {
      shareBtn.addEventListener('click', function() {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(window.location.href);
        }
        toast.classList.remove('opacity-0', 'pointer-events-none');
        toast.classList.add('opacity-100');
        setTimeout(function() {
          toast.classList.remove('opacity-100');
          toast.classList.add('opacity-0', 'pointer-events-none');
        }, 2400);
      });
    }
  })();
</script></main>
